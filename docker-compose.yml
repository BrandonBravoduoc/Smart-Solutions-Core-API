services:
  core-postgres:
    image: postgres:16-alpine
    container_name: core-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-core_db}
      POSTGRES_USER: ${DB_USERNAME:-core_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-core_pass}
    ports:
      - "5433:5432"
    volumes:
      - core_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-core_user} -d ${DB_NAME:-core_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  core-redis:
    image: redis:7-alpine
    container_name: core-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  core-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: core-api
    restart: unless-stopped
    depends_on:
      core-postgres:
        condition: service_healthy
      core-redis:
        condition: service_healthy
    environment:
      SERVER_PORT: 8082
      DB_URL: jdbc:postgresql://core-postgres:5432/${DB_NAME:-core_db}
      DB_DRIVER_CLASS_NAME: org.postgresql.Driver
      DB_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      DB_USERNAME: ${DB_USERNAME:-core_user}
      DB_PASSWORD: ${DB_PASSWORD:-core_pass}
      DDL_AUTO: update
      REDIS_HOST: core-redis
      REDIS_PORT: 6379
      REDIS_USERNAME: ${REDIS_USERNAME:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_SSL: "false"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:4200}
    ports:
      - "8082:8082"

volumes:
  core_postgres_data:
